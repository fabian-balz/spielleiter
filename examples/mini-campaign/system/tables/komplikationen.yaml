id: komplikationen
die: 1d6
entries:
  1-2: "Etwas geht zu Bruch oder verloren – ein Ausrüstungsgegenstand ist betroffen."
  3: "Unerwarteter Lärm zieht Aufmerksamkeit auf sich."
  4: "Das Wetter oder die Umgebung verschlechtert sich spürbar."
  5: "Eine dritte Partei taucht auf – Freund oder Feind ist unklar."
  6: "Eine alte Verpflichtung oder Schuld holt die Gruppe ein."
